[package]
name = "garden-desk-appcontainer-launcher"
version = "0.0.0"
edition = "2024"
publish = false

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_DXCore",
  "Win32_System_SystemInformation",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
